# =============================================================================
# Restaurant Casestudy — Nginx site config
#
# Install as:  /etc/nginx/sites-available/restaurant-casestudy
# Enable with: ln -s /etc/nginx/sites-available/restaurant-casestudy \
#                    /etc/nginx/sites-enabled/
#
# This file only ever matches its own server_name, so the site you already
# serve at the root keeps every request that isn't for this domain.
#
# setup.sh substitutes DOMAIN_PLACEHOLDER for you — it defaults to
# restaurantcasestudy.in, or whatever domain you pass as an argument.
# =============================================================================

server {
    listen 80;
    listen [::]:80;

    server_name DOMAIN_PLACEHOLDER www.DOMAIN_PLACEHOLDER;

    root /var/www/restaurant-casestudy;
    index index.html;

    # ---- Logs (separate from your other sites) -----------------------------
    access_log /var/log/nginx/restaurant-casestudy.access.log;
    error_log  /var/log/nginx/restaurant-casestudy.error.log;

    # ---- Let's Encrypt -----------------------------------------------------
    # Certificate issue and renewal. `^~` beats every regex location below, so
    # nothing here can accidentally swallow the challenge request. Kept as a
    # permanent block so renewals never depend on certbot editing this file.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        allow all;
        access_log off;
    }

    # ---- Clean URLs --------------------------------------------------------
    # /pricing        -> /pricing.html
    # /t/break-even   -> /t/break-even.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # ---- Compression -------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    # ---- Caching -----------------------------------------------------------
    # Fingerprint-free static assets: cache for a week, revalidate after.
    location ~* \.(css|js|svg|woff2?|ttf|eot|ico|png|jpe?g|gif|webp|avif)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, must-revalidate";
        access_log off;
    }

    # HTML must never be cached hard, or people get a stale app after a deploy.
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # ---- Security headers --------------------------------------------------
    add_header X-Content-Type-Options   "nosniff"          always;
    add_header X-Frame-Options          "SAMEORIGIN"       always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy       "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;

    # Content Security Policy.
    # Google Fonts is the only third party. 'unsafe-inline' is required because
    # the pages use inline <style> attributes and a few inline <script> blocks.
    add_header Content-Security-Policy "default-src 'self'; \
script-src 'self' 'unsafe-inline'; \
style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; \
font-src 'self' https://fonts.gstatic.com data:; \
img-src 'self' data:; \
connect-src 'self'; \
frame-ancestors 'self'; \
base-uri 'self'; \
form-action 'self'" always;

    # ---- Housekeeping ------------------------------------------------------
    # Never serve the repo's own files.
    location ~ /\.(git|env) { deny all; return 404; }
    location ^~ /deploy/    { deny all; return 404; }
    location = /README.md   { deny all; return 404; }

    # Optional: force clean URLs by 301-ing /pricing.html -> /pricing.
    #
    # Left OFF deliberately. The site's own internal links include .html so
    # that the folder also works when opened directly from disk. With this
    # rule on, every internal click costs an extra redirect hop.
    #
    # Turn it on if you want one canonical URL per page for SEO — the site
    # works identically either way.
    #
    # if ($request_uri ~ ^/(.*)\.html(\?|$)) {
    #     return 301 /$1;
    # }

    location = /404.html { internal; }
    error_page 404 /404.html;
}

# =============================================================================
# HTTPS is added automatically by:
#     sudo certbot --nginx -d DOMAIN_PLACEHOLDER -d www.DOMAIN_PLACEHOLDER
#
# Certbot edits only this file — it rewrites the block above to listen on 443,
# adds the certificate paths, and creates an HTTP->HTTPS redirect. Your other
# sites and their certificates are not touched.
# =============================================================================
