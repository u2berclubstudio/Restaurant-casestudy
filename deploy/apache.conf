# =============================================================================
# Restaurant Casestudy — Apache virtual host
#
# Install as:  /etc/apache2/sites-available/restaurant-casestudy.conf
# Enable with: sudo a2ensite restaurant-casestudy && sudo systemctl reload apache2
#
# Requires:    sudo a2enmod rewrite headers expires deflate
#
# Only matches its own ServerName, so your existing vhosts are unaffected.
#
# setup.sh substitutes DOMAIN_PLACEHOLDER for you — it defaults to
# restaurantcasestudy.in, or whatever domain you pass as an argument.
# =============================================================================

<VirtualHost *:80>
    ServerName  DOMAIN_PLACEHOLDER
    ServerAlias www.DOMAIN_PLACEHOLDER

    DocumentRoot /var/www/restaurant-casestudy

    ErrorLog  ${APACHE_LOG_DIR}/restaurant-casestudy.error.log
    CustomLog ${APACHE_LOG_DIR}/restaurant-casestudy.access.log combined

    <Directory /var/www/restaurant-casestudy>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        RewriteEngine On

        # Optional: force clean URLs by 301-ing /pricing.html -> /pricing.
        # Left off deliberately — the site's internal links include .html so
        # the folder also works opened straight from disk. Uncomment if you
        # want one canonical URL per page for SEO.
        #
        # RewriteCond %{THE_REQUEST} \s/([^?\s]*)\.html[\s?] [NC]
        # RewriteRule ^ /%1 [R=301,L]

        # Serve /pricing from pricing.html
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteCond %{DOCUMENT_ROOT}/$1.html -f
        RewriteRule ^(.+?)/?$ /$1.html [L]
    </Directory>

    # ---- Never serve repo internals ----------------------------------------
    <DirectoryMatch "^/var/www/restaurant-casestudy/(\.git|deploy)">
        Require all denied
    </DirectoryMatch>
    <FilesMatch "^(\.env|README\.md)$">
        Require all denied
    </FilesMatch>

    # ---- Compression -------------------------------------------------------
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/css \
            text/javascript application/javascript application/json \
            application/xml image/svg+xml
    </IfModule>

    # ---- Caching -----------------------------------------------------------
    <IfModule mod_expires.c>
        ExpiresActive On
        ExpiresByType text/css                "access plus 7 days"
        ExpiresByType application/javascript  "access plus 7 days"
        ExpiresByType image/svg+xml           "access plus 7 days"
        ExpiresByType image/png               "access plus 7 days"
        ExpiresByType image/jpeg              "access plus 7 days"
        ExpiresByType text/html               "access plus 0 seconds"
    </IfModule>

    # ---- Security headers --------------------------------------------------
    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
        Header always set Permissions-Policy "geolocation=(), microphone=(), camera=()"
        Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'"
        <FilesMatch "\.html$">
            Header set Cache-Control "no-cache, must-revalidate"
        </FilesMatch>
    </IfModule>
</VirtualHost>

# =============================================================================
# HTTPS:  sudo certbot --apache -d DOMAIN_PLACEHOLDER -d www.DOMAIN_PLACEHOLDER
# Certbot writes a separate -le-ssl.conf for this vhost only.
# =============================================================================
